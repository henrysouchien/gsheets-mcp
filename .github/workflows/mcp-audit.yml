name: MCP audit

on:
  pull_request:
    paths:
      - "src/gsheets_mcp/**"
      - "tests/**"
      - "pyproject.toml"
      - "scripts/mcp_lint.py"
      - ".pre-commit-config.yaml"
      - ".github/workflows/mcp-audit.yml"
  push:
    branches: [main]
    paths:
      - "src/gsheets_mcp/**"
      - "tests/**"
      - "pyproject.toml"
      - "scripts/mcp_lint.py"
      - ".pre-commit-config.yaml"
      - ".github/workflows/mcp-audit.yml"
  workflow_dispatch:

jobs:
  mcp-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python3 -m pip install -e ".[dev]"

      - name: Run MCP live-contract lint
        run: python3 scripts/mcp_lint.py

      - name: Run tests
        run: python3 -m pytest -q
