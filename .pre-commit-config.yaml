repos:
  - repo: local
    hooks:
      - id: mcp-tool-lint
        name: MCP live contract lint
        entry: python3 scripts/mcp_lint.py --staged
        language: system
        files: '^(src/gsheets_mcp/|tests/|scripts/mcp_lint\.py$|pyproject\.toml$|\.pre-commit-config\.yaml$|\.github/workflows/mcp-audit\.yml$)'
        pass_filenames: false
        require_serial: true
      - id: gsheets-mcp-tests
        name: gsheets-mcp tests
        entry: venv/bin/python -m pytest -q
        language: system
        files: '^(src/gsheets_mcp/|tests/|scripts/mcp_lint\.py$|pyproject\.toml$)'
        pass_filenames: false
        require_serial: true
